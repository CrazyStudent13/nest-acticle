# 博客入口 nginx：对外一个端口同时服务博客(SSR)与后端 API
# 后端已启用 /api 全局前缀，所有转发保留原始路径
server {
    listen 80;
    server_name localhost;

    # 外层还有代理（1Panel/云负载均衡）时还原真实客户端 IP；仅信任内网来源，公网直连无法伪造
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 与后端 app.file.maxSize 10MB 对齐（预留 multipart 开销）
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 后端 API
    location ^~ /api/ {
        proxy_pass http://$upstream_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件（本地存储由后端静态服务暴露）
    location ^~ /profile/ {
        proxy_pass http://$upstream_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /uploads/ {
        proxy_pass http://$upstream_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 动态解析上游：容器重建会换 IP，静态 proxy_pass 会缓存旧 IP 直到 nginx 重启
    # （曾致博客侧/管理端 API 全 502）；走 Docker 内置 DNS 按请求解析后免维护
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_server server;
    set $upstream_client client;

    # API 文档：静态 swagger 页直出（读 /openapi.json 的 live spec）。
    # 服务端 setupApiDocs 的 HTML 路由挂在 /api 全局前缀下但实际不可达（Nest 对
    # 挂在前缀下的 app.use 的处理），故 nginx 侧静态托管，规格随服务端启动实时更新
    location = /swagger-ui {
        return 301 /swagger-ui/;
    }

    location /swagger-ui/ {
        root /usr/share/nginx/html;
        try_files $uri /api-docs.html =404;
    }

    location = /docs {
        return 301 /swagger-ui/;
    }

    location = /openapi.json {
        proxy_pass http://$upstream_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 博客（Nuxt SSR）
    location / {
        proxy_pass http://$upstream_client:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
