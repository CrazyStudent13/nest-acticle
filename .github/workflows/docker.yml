# 构建三个应用镜像并推送到 ghcr.io；服务器只 pull 不 build（2G 内存机器禁止在机构建）
# 分支约定：只在 release 分支触发（正式发布）；master/dev 汇总开发，推送不构建
# 门禁约定：先过 quality job（与 quality.yml 同一套 lint/typecheck/test/build），通过才构建镜像；两处步骤须同步修改
name: build-images

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

concurrency:
  group: build-images
  cancel-in-progress: true

jobs:
  # 质量门禁：quality.yml 不监听 release，此前 release 推送只构建镜像，完全绕过 lint/typecheck/test
  # 步骤与 quality.yml 的 quality job 逐条一致（显式重复，不用 workflow_run / workflow_call），改一边须同步另一边
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 版本读 root package.json 的 packageManager 字段（pnpm@10.33.0）；须在 setup-node 之前装好，cache: pnpm 才能生效
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      # shared/utils/markdown/editor 的 types 指向 dist 构建产物，client typecheck 与 server/admin build 的模块解析都依赖它，必须先构建
      - name: 构建 workspace 共享包
        run: pnpm --filter @nest-acticle/shared --filter @nest-acticle/utils --filter @nest-acticle/markdown --filter @nest-acticle/editor build

      - name: lint（server + admin eslint）
        run: pnpm lint

      - name: client typecheck（nuxt typecheck / vue-tsc）
        run: pnpm typecheck

      - name: server test（jest，2 suites / 8 tests）
        run: pnpm test

      # nest-cli.json 未启用 swc builder，nest build 即 tsc 编译检查，兼作 server 的类型关
      - name: server build
        run: pnpm --filter server build

      - name: admin build:prod（vite build，看住 admin 依赖链可构建）
        run: pnpm --filter admin build:prod

  build:
    # 门禁通过才构建并推送镜像；quality 失败时整个 matrix 跳过
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: server
            suffix: server
          - app: client
            suffix: client
          - app: admin
            suffix: admin
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像前缀（ghcr 要求全小写）
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.suffix }}:latest
          build-args: NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # 覆盖 latest 后旧版本变成 untagged，仍占 ghcr 私有免费额度（500MB），尽力清掉
      # GITHUB_TOKEN 删除权限受限时此步会失败，不影响镜像发布；可在网页端手动删
      - name: 清理 untagged 旧版本
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ github.event.repository.name }}-${{ matrix.suffix }}
        run: |
          gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PKG}/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id' \
          | xargs -r -I{} gh api -X DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PKG}/versions/{}"