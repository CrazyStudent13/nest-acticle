# 构建三个应用镜像并推送到 ghcr.io；服务器只 pull 不 build（2G 内存机器禁止在机构建）
# 分支约定：只在 release 分支触发（正式发布）；master/dev 汇总开发，推送不构建
name: build-images

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

concurrency:
  group: build-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: server
            suffix: server
          - app: client
            suffix: client
          - app: admin
            suffix: admin
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像前缀（ghcr 要求全小写）
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.suffix }}:latest
          build-args: NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # 覆盖 latest 后旧版本变成 untagged，仍占 ghcr 私有免费额度（500MB），尽力清掉
      # GITHUB_TOKEN 删除权限受限时此步会失败，不影响镜像发布；可在网页端手动删
      - name: 清理 untagged 旧版本
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ github.event.repository.name }}-${{ matrix.suffix }}
        run: |
          gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PKG}/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id' \
          | xargs -r -I{} gh api -X DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PKG}/versions/{}"