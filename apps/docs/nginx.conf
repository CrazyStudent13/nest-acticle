server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # VitePress 静态站（base=/manual/）：文件树在 html/manual/ 下，URI 与磁盘一一对应
    location /manual/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # 无前缀访问统一重定向到带前缀形态
    location / {
        return 301 /manual/$request_uri;
    }
}
